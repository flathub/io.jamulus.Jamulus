app-id: io.jamulus.Jamulus
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: Jamulus
rename-icon: io.jamulus.jamulus
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  - --device=all
cleanup:
  - /share/man
modules:
  - name: jamulus
    buildsystem: qmake
    build-commands:
      - install -Dm644 io.jamulus.Jamulus.desktop -t /app/share/applications/
      - install -Dm644 io.jamulus.Jamulus.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/jamulussoftware/jamulus.git
        tag: r3_12_6
        commit: b2bf22e0d329a43dd222749737df244b8fc3b16e
        x-checker-data:
          type: anitya
          project-id: 155434
          stable-only: true
          tag-template: r$version
      - type: file
        path: io.jamulus.Jamulus.desktop
      - type: file
        path: io.jamulus.Jamulus.metainfo.xml
